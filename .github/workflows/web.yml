name: Build and deploy WebAssembly

on:
  push:
    branches: [emscripten-web-port]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: ${{ contains(github.event.head_commit.message, '[bootstrap-wasm-run]') && format('web-wasm-bootstrap-{0}', github.run_id) || format('web-wasm-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -L "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source
          rm source.tar.gz
          shopt -s dotglob
          cp -a source/. .
          rm -rf source

      - name: Cancel stale WebAssembly runs
        if: contains(github.event.head_commit.message, '[bootstrap-wasm-run]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in $(gh run list --workflow web.yml --branch "$GITHUB_REF_NAME" --json databaseId,status --limit 20 --jq '.[] | select(.status == "queued" or .status == "in_progress") | .databaseId'); do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
            fi
          done

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install Meson and Ninja
        run: python3 -m pip install --upgrade meson ninja

      - name: Configure
        run: |
          emcc --version
          meson setup build \
            --cross-file scripts/emscripten_native.txt \
            -Dbuildtype=release \
            -Dunity=off \
            -Drenderer=gles \
            -Dui_backend=java \
            -Denable_vsync=false \
            -Denable_mimalloc=disabled

      - name: Build
        run: meson compile -C build -j2 targets/app/Minecraft.Client.html

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp web/shell.html site/index.html
          cp build/targets/app/Minecraft.Client.html.js site/
          cp build/targets/app/Minecraft.Client.html.wasm site/
          cp build/targets/app/Minecraft.Client.html.data site/
          cp web/web-runtime.js site/
          cp web/manifest.webmanifest site/
          cp web/coi-serviceworker.js site/
          touch site/.nojekyll
          ls -lh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
