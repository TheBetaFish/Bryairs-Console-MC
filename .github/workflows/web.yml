name: Build and deploy WebAssembly

on:
  push:
    branches: [emscripten-web-port]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -L "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source
          rm source.tar.gz
          shopt -s dotglob
          cp -a source/. .
          rm -rf source
          git status --short || true

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install Meson and Ninja
        run: python3 -m pip install --upgrade meson ninja

      - name: Configure
        run: |
          emcc --version
          meson setup build \
            --cross-file scripts/emscripten_native.txt \
            -Dbuildtype=release \
            -Dunity=off \
            -Drenderer=gles \
            -Dui_backend=java \
            -Denable_vsync=false \
            -Denable_mimalloc=disabled

      - name: Build
        run: meson compile -C build -j2

      - name: Assemble Pages site
        run: |
          rm -rf site
          mkdir -p site
          cp build/targets/app/Minecraft.Client.* site/
          cp web/coi-serviceworker.js site/
          cp build/targets/app/Minecraft.Client.html site/index.html
          rm -f site/Minecraft.Client.html
          touch site/.nojekyll
          ls -lh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
