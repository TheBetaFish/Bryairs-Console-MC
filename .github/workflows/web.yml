name: Build and deploy WebAssembly

on:
  push:
    branches: [emscripten-web-port]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -L "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source
          rm source.tar.gz
          shopt -s dotglob
          cp -a source/. .
          rm -rf source

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install Meson and Ninja
        run: python3 -m pip install --upgrade meson ninja

      - name: Configure
        run: |
          emcc --version
          meson setup build \
            --cross-file scripts/emscripten_native.txt \
            -Dbuildtype=release \
            -Dunity=off \
            -Drenderer=gles \
            -Dui_backend=java \
            -Denable_vsync=false \
            -Denable_mimalloc=disabled

      - name: Build
        run: meson compile -C build -j2 targets/app/Minecraft.Client.html

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp web/shell.html site/index.html
          cp build/targets/app/Minecraft.Client.html.js site/
          cp build/targets/app/Minecraft.Client.html.wasm site/
          cp build/targets/app/Minecraft.Client.html.data site/
          cp web/web-runtime.js site/
          cp web/manifest.webmanifest site/
          cp web/coi-serviceworker.js site/
          touch site/.nojekyll
          ls -lh site

      - name: Browser WebGL smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory site > /tmp/bryairs-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT

          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';

          const errors = [];
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--enable-webgl',
              '--use-angle=swiftshader',
            ],
          });

          const page = await browser.newPage();
          page.on('console', msg => {
            const line = '[browser:' + msg.type() + '] ' + msg.text();
            console.log(line);
            if (msg.type() === 'error') errors.push(line);
          });
          page.on('pageerror', error => {
            const line = '[pageerror] ' + error.message;
            console.log(line);
            errors.push(line);
          });

          try {
            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(15000);

            const status = await page.locator('#status').textContent();
            const hidden = await page.locator('#loading-screen').evaluate(
              el => el.classList.contains('hidden')
            );

            console.log('[smoke] loadingHidden=' + hidden);
            console.log('[smoke] status=' + (status || '(empty)'));

            const relevant = errors.filter(line =>
              /attachShader|shader|WebGL|WebAssembly|GLSL/i.test(line)
            );

            if (relevant.length) {
              throw new Error(
                'WebGL/runtime errors detected:\n' + relevant.join('\n')
              );
            }
            if (!hidden) {
              throw new Error(
                'Game never presented its first frame. Status: ' +
                (status || '(empty)')
              );
            }

            console.log('[smoke] PASS: game reached first frame.');
          } finally {
            await browser.close();
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
