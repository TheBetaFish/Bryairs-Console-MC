name: Build and deploy WebAssembly

on:
  push:
    branches: [emscripten-web-port]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install Meson and Ninja
        run: python3 -m pip install --upgrade meson ninja

      - name: Configure
        run: |
          emcc --version
          meson setup build \
            --cross-file scripts/emscripten_native.txt \
            -Dbuildtype=release \
            -Drenderer=gles \
            -Dui_backend=shiggy \
            -Denable_vsync=false \
            -Denable_mimalloc=disabled

      - name: Build
        run: meson compile -C build -j2

      - name: Assemble Pages site
        run: |
          rm -rf site
          mkdir -p site
          cp build/targets/app/Minecraft.Client.* site/
          cp web/coi-serviceworker.js site/
          cp build/targets/app/Minecraft.Client.html site/index.html
          rm -f site/Minecraft.Client.html
          touch site/.nojekyll
          ls -lh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
