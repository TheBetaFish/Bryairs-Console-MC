name: Live WebGL smoke test

on:
  push:
    branches: [emscripten-web-port]
    paths:
      - .github/workflows/web-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

      - name: Test live Pages site
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--enable-webgl',
              '--use-angle=swiftshader',
            ],
          });

          const page = await browser.newPage();
          const errors = [];

          page.on('console', msg => {
            const line = '[browser:' + msg.type() + '] ' + msg.text();
            console.log(line);
            if (msg.type() === 'error') errors.push(line);
          });

          page.on('pageerror', error => {
            const line = '[pageerror] ' + error.message;
            console.log(line);
            errors.push(line);
          });

          try {
            await page.goto(
              'https://thebetafish.github.io/Bryairs-Console-MC/',
              { waitUntil: 'domcontentloaded', timeout: 60000 }
            );

            await page.waitForTimeout(20000);

            const status = await page.locator('#status').textContent();
            const hidden = await page.locator('#loading-screen').evaluate(
              el => el.classList.contains('hidden')
            );

            console.log('[smoke] loadingHidden=' + hidden);
            console.log('[smoke] status=' + (status || '(empty)'));
            console.log('[smoke] WebGL-related errors=' +
              errors.filter(x => /attachShader|shader|WebGL|WebAssembly|GLSL/i.test(x)).length);

            const relevant = errors.filter(x =>
              /attachShader|shader|WebGL|WebAssembly|GLSL/i.test(x)
            );

            if (relevant.length) {
              throw new Error('LIVE WEBGL FAILURE:\n' + relevant.join('\n'));
            }

            if (!hidden) {
              throw new Error(
                'Live page never reached its first frame. Status: ' +
                (status || '(empty)')
              );
            }

            console.log('[smoke] PASS');
          } finally {
            await browser.close();
          }
          EOF
