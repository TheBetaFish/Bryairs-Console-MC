<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bryair's Console Minecraft</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{display:flex;align-items:center;justify-content:center}
    #canvas{width:100vw;height:100vh;display:block;background:#000}
    #status{position:fixed;left:12px;bottom:12px;color:#fff;background:#000a;
      font:14px monospace;padding:8px;border-radius:4px;z-index:10}
    #progress{width:260px}
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">Loading… <progress id="progress" value="0" max="100"></progress></div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./coi-serviceworker.js').then(function() {
        if (!navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(function() {
            location.reload();
          });
        }
      }).catch(console.error);
    }
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function(text) {
        var s = document.getElementById('status');
        if (s) s.textContent = text;
      },
      monitorRunDependencies: function(left) {
        var p = document.getElementById('progress');
        if (p) p.value = 100 - Math.min(left, 100);
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
